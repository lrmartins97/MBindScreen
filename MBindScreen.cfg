# Configuracao do MBindScreen. Para mudar numa maquina, copiar este ficheiro para
# ~/printer_data/config/MBindScreen.cfg: esse tem prioridade sobre este.

[server]
host: localhost
port: 7125

[screen]
# Minutos sem tocar ate o ecra apagar (0 = nunca)
sleep_minutes: 0

[camera]
# Camara do bico, pelo nginx (a mesma do NozzleSight, porta 8081)
calibration: /webcam2/snapshot?max_delay=0
